<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<script>document.documentElement.classList.add("js")</script>
<title>Nossos Bots 🇧🇷</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b0d11; --card:#161a21; --card-hi:#1d222b;
    --txt:#f4f6fa; --dim:#8b95a6; --line:#232935;
    --accent:#3ea6ff; --accent2:#ff4d8d;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.4; padding:0 0 40px;
    -webkit-font-smoothing:antialiased;
  }

  /* 顶部：渐变 + 光晕 */
  .hero{
    position:relative; padding:34px 20px 26px; text-align:center; overflow:hidden;
    background:
      radial-gradient(120% 90% at 80% 0%, rgba(255,77,141,.22) 0%, transparent 55%),
      radial-gradient(100% 80% at 15% 10%, rgba(62,166,255,.18) 0%, transparent 60%),
      linear-gradient(180deg,#151018 0%, var(--bg) 100%);
  }
  .hero h1{margin:0 0 8px; font-size:26px; font-weight:750; letter-spacing:-.5px}
  .hero p{margin:0; color:var(--dim); font-size:14px}
  .pills{display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap}
  .pill{
    background:rgba(255,255,255,.06); border:1px solid var(--line);
    border-radius:999px; padding:5px 12px; font-size:12px; color:var(--dim);
    backdrop-filter:blur(8px);
  }

  .wrap{max-width:600px; margin:0 auto; padding:0 16px}

  /* 分类标题 */
  .cat{
    display:flex; align-items:center; gap:8px;
    margin:26px 4px 12px; font-size:12.5px; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--dim);
  }
  .cat::after{content:""; flex:1; height:1px; background:var(--line)}

  /* 卡片 */
  .card{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:13px 14px; margin-bottom:9px;
    text-decoration:none; color:inherit; cursor:pointer;
    transition:transform .14s cubic-bezier(.2,.8,.3,1), background .14s, border-color .14s;
    will-change:transform;
  }
  .card:active{transform:scale(.972); background:var(--card-hi); border-color:#2e3644}

  .av{
    flex:0 0 52px; width:52px; height:52px; border-radius:15px;
    background:#222834; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  }
  .av img{width:100%; height:100%; object-fit:cover; display:block}

  .info{flex:1; min-width:0}
  .name{
    font-size:15.5px; font-weight:650; margin-bottom:3px;
    display:flex; align-items:center; gap:6px;
  }
  .desc{
    font-size:12.5px; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .arrow{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    background:rgba(62,166,255,.14); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; line-height:1;
  }
  .tag{
    font-size:9.5px; font-weight:800; letter-spacing:.04em;
    background:var(--accent2); color:#fff; padding:2px 6px; border-radius:5px;
    text-transform:uppercase; flex:0 0 auto;
  }

  footer{text-align:center; color:var(--dim); font-size:12px; margin-top:32px; padding:0 20px}
  .hint{
    margin:18px auto 0; max-width:600px; padding:11px 14px;
    background:rgba(62,166,255,.07); border:1px solid rgba(62,166,255,.18);
    border-radius:12px; font-size:12.5px; color:#a8c6e8; text-align:center;
  }
  /* ══ 交互质感：借自 huangbai-scrolling 的滚动模式（无视频版）══════
     ① 顶部滚动进度条   ② 卡片入视口淡入   ③ 分类吸顶高亮
     ④ 背景浮尘         ⑤ prefers-reduced-motion 全量降级        */

  /* ① 进度条 —— 对应它的 .sw-scrollbar */
  .progress{
    position:fixed; top:0; left:0; right:0; height:4px; z-index:60;
    background:rgba(62,166,255,.20); pointer-events:none;
    box-shadow:0 0 14px rgba(62,166,255,.45);
  }
  .progress span{
    display:block; height:100%; width:100%; transform:scaleX(0);
    transform-origin:0 50%; will-change:transform;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow:0 0 16px rgba(255,77,141,.75);
  }

  /* ② 卡片入场：按分类四种动作，不是统一淡入
     ⚠️ 只在 .js 下才隐藏 —— 万一脚本出错/被拦，卡片必须照常可见 */
  .js .card{opacity:0}
  .js .card.in{
    opacity:1;
    animation-duration:.66s;
    animation-timing-function:cubic-bezier(.19,.9,.28,1);
    /* backwards：延迟期间保持 from 状态，动画结束不占用 transform，
       这样 .card:active 的缩放仍然生效 */
    animation-fill-mode:backwards;
    animation-delay:calc(var(--i, 0) * 75ms);
  }

  /* 💔 Relacionamento —— 名片递过来：侧身翻转 + 从左侧送来 */
  .js .card.cat-amor.in{animation-name:inName}
  @keyframes inName{
    from{opacity:0; transform:perspective(900px) rotateY(-76deg) translateX(-56px)}
    65% {opacity:1}
    to  {opacity:1; transform:perspective(900px) rotateY(0) translateX(0)}
  }

  /* 📰 Notícias —— 报纸从远处飘来：缩小 + 微倾 + 由上落下 */
  .js .card.cat-news.in{animation-name:inPaper}
  @keyframes inPaper{
    from{opacity:0; transform:translateY(-70px) scale(.58) rotate(-7deg)}
    55% {opacity:1; transform:translateY(6px) scale(1.02) rotate(1.5deg)}
    to  {opacity:1; transform:translateY(0) scale(1) rotate(0)}
  }

  /* 💼 Trabalho e dinheiro —— 文件递上来：从右侧滑入 */
  .js .card.cat-work.in{animation-name:inWork}
  @keyframes inWork{
    from{opacity:0; transform:translateX(88px) scale(.96)}
    70% {opacity:1}
    to  {opacity:1; transform:translateX(0) scale(1)}
  }

  /* ⚽ Esportes e jogos —— 球滚进来：带旋转从左侧滚入 */
  .js .card.cat-play.in{animation-name:inBall}
  @keyframes inBall{
    from{opacity:0; transform:translateX(-115%) rotate(-190deg) scale(.9)}
    60% {opacity:1; transform:translateX(0) rotate(6deg) scale(1.015)}
    to  {opacity:1; transform:translateX(0) rotate(0) scale(1)}
  }

  /* ③ 分类标题吸顶 */
  .cat{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding-top:10px; padding-bottom:6px;
  }
  .cat.stuck{color:var(--accent)}

  /* ④ 背景浮尘 —— 对应它的 .sw-particles / sw-drift
     ⚠️ 三个坑（都实际踩过）：
        ① z-index 必须高于内容层，否则被实色卡片完全盖住
        ② 峰值不透明度必须 ≥.6，否则在 #0b0d11 上等于看不见
        ③ animation-delay 必须短，否则初访前 10 秒空白 */
  .dust{position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden}
  .dust i{
    position:absolute; border-radius:50%; opacity:0;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%  {opacity:0;   transform:translate(0,0) scale(.5)}
    8%  {opacity:.75}
    70% {opacity:.5}
    100%{opacity:0;   transform:translate(5vw,-58vh) scale(1.2)}
  }
  .hero, .wrap, footer{position:relative; z-index:1}

  /* ⑤ 减少动态效果：全部降级为静态 */
  @media (prefers-reduced-motion: reduce){
    .js .card, .js .card.in{opacity:1 !important; animation:none !important}
    .dust{display:none}
    .progress span{transition:none}
  }
</style>
</head>
<body>

<div class="progress"><span id="pbar"></span></div>
<div class="dust" id="dust" aria-hidden="true"></div>

<div class="hero">
  <h1>🇧🇷 Nossos Bots</h1>
  <p>Tudo que a gente faz no Telegram, num lugar só.</p>
  <div class="pills">
    <span class="pill">9 bots</span>
    <span class="pill">100% grátis</span>
    <span class="pill">em português</span>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="hint">👆 Toque em qualquer bot pra abrir no Telegram</div>

<footer>Feito no Brasil 🇧🇷</footer>

<script>
// ─────────────────────────────────────────────────────────────────
// 数据：加新 bot 只改这个数组
//   cat  = 分类（决定分在哪一组）
//   av   = avatars/ 里的文件名（没有就留空，会退化成一个字母）
// ─────────────────────────────────────────────────────────────────
const CATS = [
  { key: "amor",  label: "💔 Relacionamento" },
  { key: "news",  label: "📰 Notícias" },
  { key: "work",  label: "💼 Trabalho e dinheiro" },
  { key: "play",  label: "⚽ Esportes e jogos" },
];

const BOTS = [
  { cat:"amor", name:"Tribunal do Crush", user:"TretaDoCrushBot", av:"TretaDoCrushBot.jpg",
    desc:"Desafie os amigos e julgue as tretas", tag:"novo", icon:"💔" },
  { cat:"news", name:"Notícias Agora", user:"NoticiasAgorabot", av:"NoticiasAgorabot.jpg",
    desc:"As principais notícias do Brasil", icon:"📰" },
  { cat:"news", name:"Radar BR Viral", user:"RadarBRViralbot", av:"RadarBRViralbot.jpg",
    desc:"O que está bombando agora", icon:"🔥" },
  { cat:"news", name:"Brasil Sem Filtro", user:"brasil_sem_filtro_bot", av:"brasil_sem_filtro_bot.jpg",
    desc:"Vote nos assuntos do dia a dia", icon:"🇧🇷" },
  { cat:"work", name:"Empregos Brasil", user:"EmpregosBrasilbot", av:"EmpregosBrasilbot.jpg",
    desc:"Vagas por cidade e profissão", icon:"💼" },
  { cat:"work", name:"Ofertas BR Hoje", user:"OfertasBRHojeBot", av:"OfertasBRHojeBot.jpg",
    desc:"Compare preços e receba alertas", icon:"🛒" },
  { cat:"play", name:"Radardo Esporte", user:"RadardoEsportebot", av:"RadardoEsportebot.jpg",
    desc:"Jogos de hoje e palpites", icon:"⚽" },
  { cat:"play", name:"Futebol em Foco", user:"FutebolEmFocoBot", av:"FutebolEmFocoBot.jpg",
    desc:"Brasileirão, tabelas e transferências", icon:"🏆" },
  { cat:"play", name:"Game na Veia", user:"game_na_veia_bot", av:"game_na_veia_bot.jpg",
    desc:"Quiz gamer diário e enquetes", icon:"🎮" },
];

const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");

function haptic() {
  try { tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {}
}

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

const app = document.getElementById("app");
for (const c of CATS) {
  const items = BOTS.filter(b => b.cat === c.key);
  if (!items.length) continue;
  app.appendChild(el("div", "cat", c.label));

  let idx = 0;
  for (const b of items) {
    const url = "https://t.me/" + b.user;
    // 分类类名决定入场动画；--i 让同组卡片错开（不是整屏一起蹦出来）
    const card = el("a", "card cat-" + c.key);
    card.style.setProperty("--i", idx++);
    card.href = url;
    card.rel = "noopener";

    // 头像：有图用图，没有就退化成 emoji（避免空白方块）
    const av = el("div", "av");
    if (b.av) {
      const img = document.createElement("img");
      img.src = "avatars/" + b.av;
      img.alt = b.name;
      img.loading = "lazy";
      // 图挂了就退回 emoji，别留破图
      img.onerror = () => { av.innerHTML = b.icon || "🤖"; };
      av.appendChild(img);
    } else {
      av.textContent = b.icon || "🤖";
    }

    card.appendChild(av);
    card.appendChild(el("div", "info",
      `<div class="name">${b.name}${b.tag ? `<span class="tag">${b.tag}</span>` : ""}</div>
       <div class="desc">${b.desc}</div>`));
    card.appendChild(el("div", "arrow", "›"));

    // ⚠️ Mini App 里不能靠 <a href> 跳转 —— Telegram 会拦掉 WebApp 的页面导航
    //    （防劫持）。必须走 openTelegramLink()。浏览器里它不存在，就用默认行为。
    card.addEventListener("click", (ev) => {
      haptic();
      if (!inTelegram) return;
      ev.preventDefault();
      try {
        if (tg.openTelegramLink) tg.openTelegramLink(url);
        else if (tg.openLink) tg.openLink(url);
        else location.href = url;
      } catch (e) { location.href = url; }
    });

    app.appendChild(card);
  }
}

// ═══════════════════════════════════════════════════════════════════
// 交互质感：借自 huangbai-scrolling 的滚动模式（无视频，包体 +1.6KB）
//   ① 顶部进度条      ② 卡片入视口淡入
//   ③ 分类吸顶高亮    ④ 背景浮尘
//   ⑤ rAF 节流滚动 —— 它引擎里的 ticking 模式，避免每次 scroll 都算布局
//   ⑥ prefers-reduced-motion → 全部降级为静态
// ═══════════════════════════════════════════════════════════════════
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pbar = document.getElementById('pbar');
const cards = document.querySelectorAll('.card');

// ⑤ rAF 节流：scroll 只标脏，计算放到下一帧
let ticking = false;
function readScroll() {
  const d = document.documentElement;
  const max = d.scrollHeight - d.clientHeight;
  const p = max > 0 ? d.scrollTop / max : 0;
  if (pbar) pbar.style.transform = `scaleX(${p.toFixed(4)})`;
  ticking = false;
}
window.addEventListener('scroll', () => {
  if (!ticking) { ticking = true; requestAnimationFrame(readScroll); }
}, { passive: true });
readScroll();

// ② 卡片进入视口时播一次入场动画（只播一次，不会来回闪）
if (!REDUCE && 'IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }
  }, { rootMargin: '0px 0px -6% 0px' });
  cards.forEach(c => io.observe(c));
} else {
  cards.forEach(c => c.classList.add('in'));
}

// ③ 分类标题吸顶时变色
if ('IntersectionObserver' in window) {
  const catIo = new IntersectionObserver((entries) => {
    for (const e of entries) e.target.classList.toggle('stuck', !e.isIntersecting);
  }, { rootMargin: '-4px 0px 0px 0px' });
  document.querySelectorAll('.cat').forEach(c => catIo.observe(c));
}

// ④ 背景浮尘：9 个，纯 CSS 动画，JS 只负责摆位置
if (!REDUCE) {
  const dust = document.getElementById('dust');
  const tints = ['#3ea6ff', '#ff4d8d', '#ffd60a'];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('i');
    const size = 3 + Math.random() * 5;                 // 3–8px（原来 2–6 太小）
    const tint = tints[i % 3];
    s.style.cssText =
      `width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;` +
      `left:${4 + Math.random() * 92}%;` +
      `top:${(86 + Math.random() * 22).toFixed(1)}%;` +   // 从屏幕下方起
      `background:${tint};opacity:.32;` +                 // 兜底：动画不跑时也看得见
      `box-shadow:0 0 ${size * 2}px ${tint};` +          // glow：小尺寸在深底上才看得见
      `animation-duration:${16 + Math.random() * 12}s;` +
      `animation-delay:${(Math.random() * 4).toFixed(2)}s;`;  // 4s 内全部起步（原来 10s）
    dust.appendChild(s);
  }
}

// Telegram 原生外观
try {
  if (tg) {
    tg.ready(); tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor("#151018");
    if (tg.setBackgroundColor) tg.setBackgroundColor("#0b0d11");
    // 往回滑/点返回键时不至于直接退出
    if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
  }
} catch (e) {}
</script>
</body>
</html>
