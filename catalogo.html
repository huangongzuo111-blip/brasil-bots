<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nossos Bots 🇧🇷</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f;
    --txt:#f2f4f8; --dim:#9aa3b2; --line:#2a2f3a;
    --accent:#3ea6ff; --accent2:#ff4d8d;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f4f6fa;--card:#fff;--card2:#eef1f6;--txt:#141821;--dim:#5d6680;--line:#e2e6ee;}
    :root{--dim:#5d6680;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:18px 14px 40px;
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
  }
  header{text-align:center;margin:8px 0 22px}
  header h1{margin:0 0 6px;font-size:23px;letter-spacing:-.3px}
  header p{margin:0;color:var(--dim);font-size:14px}
  .hint{margin-top:10px;font-size:12px;color:var(--dim)}
  .grid{display:grid;gap:12px;max-width:560px;margin:0 auto}
  a.bot{
    display:flex;align-items:center;gap:13px;
    background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:14px 15px;text-decoration:none;color:inherit;
    transition:transform .12s ease,background .12s ease;
  }
  a.bot:active{transform:scale(.985);background:var(--card2)}
  .ico{
    flex:0 0 46px;height:46px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    font-size:23px;background:var(--card2);
  }
  .meta{flex:1;min-width:0}
  .name{font-weight:650;font-size:15.5px;margin-bottom:2px}
  .desc{color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .go{flex:0 0 auto;color:var(--accent);font-size:19px;font-weight:700}
  .tag{
    display:inline-block;margin-left:7px;padding:1px 7px;border-radius:20px;
    font-size:10.5px;font-weight:700;vertical-align:middle;
    background:var(--accent2);color:#fff;
  }
  footer{margin:26px auto 0;max-width:560px;text-align:center;color:var(--dim);font-size:12px}
  .card-top{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
  .chip{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:12.5px;color:var(--dim)
  }
</style>
</head>
<body>
<header>
  <h1>🇧🇷 Nossos Bots</h1>
  <p>Tudo que a gente faz no Telegram, num lugar só.</p>
  <div class="card-top">
    <span class="chip">9 bots</span>
    <span class="chip">100% grátis</span>
    <span class="chip">em português</span>
  </div>
</header>

<div class="grid" id="grid"></div>

<footer>
  <p>Toque em qualquer bot pra abrir no Telegram 👆</p>
  <p style="opacity:.65">Feito no Brasil 🇧🇷</p>
</footer>

<script>
// 数据集中在这里，加新 bot 只改这个数组
const BOTS = [
  {ico:"💔", name:"Tribunal do Crush", user:"TretaDoCrushBot", tag:"novo",
   desc:"Desafie amigos e vote nas tretas de relacionamento"},
  {ico:"📰", name:"Notícias Agora", user:"NoticiasAgorabot",
   desc:"As principais notícias do Brasil, todos os dias"},
  {ico:"🔥", name:"Radar BR Viral", user:"RadarBRViralbot",
   desc:"O que está bombando no Brasil agora"},
  {ico:"🇧🇷", name:"Brasil Sem Filtro", user:"brasil_sem_filtro_bot",
   desc:"Vote nos assuntos do dia a dia do brasileiro"},
  {ico:"💼", name:"Empregos Brasil", user:"EmpregosBrasilbot",
   desc:"Busque vagas por cidade e profissão"},
  {ico:"🛒", name:"Ofertas BR Hoje", user:"OfertasBRHojeBot",
   desc:"Compare preços e receba alerta de queda"},
  {ico:"⚽", name:"Radardo Esporte", user:"RadardoEsportebot",
   desc:"Jogos de hoje, notícias e palpites esportivos"},
  {ico:"🎮", name:"Game na Veia", user:"game_na_veia_bot",
   desc:"Quiz gamer diário e enquetes"},
  {ico:"⚽", name:"Futebol em Foco", user:"FutebolEmFocoBot",
   desc:"Brasileirão, transferências e tabelas"},
];

const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData !== undefined && tg.platform && tg.platform !== "unknown");

const grid = document.getElementById("grid");
for (const b of BOTS) {
  const url = "https://t.me/" + b.user;
  const a = document.createElement("a");
  a.className = "bot";
  a.href = url;                      // 普通浏览器里就靠它跳
  a.rel = "noopener";
  a.innerHTML = `
    <div class="ico">${b.ico}</div>
    <div class="meta">
      <div class="name">${b.name}${b.tag ? `<span class="tag">${b.tag}</span>` : ""}</div>
      <div class="desc">${b.desc}</div>
    </div>
    <div class="go">›</div>`;

  // ⚠️ Mini App 里 **不能** 靠 <a href> 跳转 —— Telegram 会拦掉页面的直接导航
  //    （防止 WebApp 把用户带去别处）。必须走 openTelegramLink()。
  //    普通浏览器打开时它不存在，就退回默认的 <a href> 行为。
  a.addEventListener("click", (ev) => {
    if (!inTelegram) return;                 // 浏览器里照常跳
    ev.preventDefault();
    try {
      if (tg.openTelegramLink) tg.openTelegramLink(url);
      else tg.openLink && tg.openLink(url);
    } catch (e) {
      location.href = url;                   // 兜底
    }
  });

  grid.appendChild(a);
}

// 在 Telegram 里打开时用原生主题色 + 撑满视口
try {
  if (tg) {
    tg.ready(); tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor("#0f1115");
    if (tg.setBackgroundColor) tg.setBackgroundColor("#0f1115");
  }
} catch (e) {}
</script>
</body>
</html>
